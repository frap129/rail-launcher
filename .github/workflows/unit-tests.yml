name: Run unit tests
on:
  push:
    branches:
      - 'main'
  pull_request:

jobs:
  unit_tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - name: Run unit tests
        run: bash ./gradlew testDebugUnitTest
